<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Calculator</title><style>body{font-family:system-ui;max-width:600px;margin:3rem auto;padding:1rem}.card{border:1px solid #ddd;border-radius:12px;padding:1.5rem}label{display:block;margin:1rem 0}input{display:block;width:100%;padding:.7rem;box-sizing:border-box}button{margin-top:1rem;padding:.7rem 1rem}.total{font-size:1.5rem;margin-top:1.5rem}</style></head><body><div class="card"><h1>Expense Calculator</h1><label>Amount<input id="amount" type="number" value="500"></label><label>Quantity<input id="quantity" type="number" value="3"></label><button id="calculate">Calculate</button><p id="message" class="total">Total: ₹0</p></div><script src="script.js"></script></body></html>
