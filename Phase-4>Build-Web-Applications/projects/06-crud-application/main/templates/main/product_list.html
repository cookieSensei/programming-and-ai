{% extends "main/base.html" %}{% block content %}<h1>Inventory</h1><p><a href="{% url 'product_create' %}">+ Add Product</a></p>{% for product in products %}<div class="card"><h2>{{ product.name }}</h2><p>₹{{ product.price }} · {{ product.quantity }} in stock</p><p><a href="{% url 'product_detail' product.pk %}">View</a></p></div>{% empty %}<p>No products yet.</p>{% endfor %}{% endblock %}
