<!doctype html><html><head><meta charset="utf-8"><title>Customer Feedback</title><style>body{font-family:system-ui;max-width:700px;margin:2rem auto}input,textarea,select{display:block;width:100%;padding:.6rem;margin:.3rem 0 1rem}button{padding:.7rem 1rem}.errors{color:#b91c1c}</style></head><body><h1>Customer Feedback</h1>{% if errors %}<div class="errors"><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}<form method="post">{% csrf_token %}<label>Name<input name="name" value="{{ values.name }}"></label><label>Email<input name="email" type="email" value="{{ values.email }}"></label><label>Feedback<textarea name="feedback">{{ values.feedback }}</textarea></label><label>Rating<select name="rating"><option value="">Choose</option>{% for value in "12345" %}<option value="{{ value }}" {% if values.rating == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><button type="submit">Submit Feedback</button></form></body></html>
