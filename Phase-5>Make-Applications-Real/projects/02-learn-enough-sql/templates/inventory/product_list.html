<!doctype html>
<html>
<head><meta charset="utf-8"><title>Products</title></head>
<body>
<h1>Products</h1>
<ul>
{% for product in products %}
<li>
<a href="{% url 'product-detail' product.pk %}">{{ product.name }}</a>
— ₹{{ product.price }}
</li>
{% empty %}
<li>No products yet.</li>
{% endfor %}
</ul>
</body>
</html>
