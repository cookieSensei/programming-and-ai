{% extends "base.html" %}
{% block content %}
<h1>{{ service.name }}</h1>
<p>{{ service.description }}</p>
<p>₹{{ service.price }} · {{ service.duration_minutes }} minutes</p>
{% if user.is_authenticated %}
<a href="{% url 'book-service' service.pk %}">Book this service</a>
{% else %}
<p><a href="{% url 'login' %}">Log in</a> to book.</p>
{% endif %}
{% endblock %}
